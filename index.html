<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a3818">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Natura Viva">
<title>Natura Viva Gardens</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Pantalla de login -->
<div id="login-screen" class="login-screen">
  <div class="login-box">
    <img src="icons/logo-login.png" alt="Natura Viva Gardens" class="login-logo">
    <div class="login-subtitle">Acceso restringido</div>
    <div class="login-field">
      <label>Usuario</label>
      <input type="text" id="login-user" autocomplete="username" autocapitalize="none" autocorrect="off">
    </div>
    <div class="login-field">
      <label>Contraseña</label>
      <input type="password" id="login-pass" autocomplete="current-password">
    </div>
    <div id="login-error" class="login-error"></div>
    <button id="login-btn" class="login-submit">Entrar</button>
  </div>
</div>

<div class="app" id="app" style="display:none">
  <div class="topbar">
    <div class="logo-area">
      <img src="icons/logo-header.png" alt="Natura Viva Gardens" class="header-logo">
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span id="current-user-badge" class="user-badge"></span>
      <button id="logout-btn" class="logout-btn" title="Cerrar sesión">⏻</button>
    </div>
  </div>
  <div class="nav-tabs" id="nav-tabs">
    <div class="nav-tab active" data-tab="semana">🗓️ Semana</div>
    <div class="nav-tab" data-tab="mes">📅 Mes</div>
    <div class="nav-tab" data-tab="tareas">✓ Tareas</div>
    <div class="nav-tab" data-tab="equipo">👥 Equipo</div>
  </div>
  <div class="content">
    <div id="view-semana"></div>
    <div id="view-mes" style="display:none"></div>
    <div id="view-tareas" style="display:none"></div>
    <div id="view-equipo" style="display:none"></div>
    <div id="view-casa" style="display:none"></div>
    <div id="view-empleado" style="display:none"></div>
    <div id="view-combustible" style="display:none"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="firebase-config.js"></script>
<script src="firebase-sync.js" type="module"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then(reg => {
        // Comprobar actualizaciones cada vez que se carga
        reg.update();
        // Si se detecta versión nueva, recargar automáticamente
        reg.addEventListener('updatefound', () => {
          const newSW = reg.installing;
          if (newSW) {
            newSW.addEventListener('statechange', () => {
              if (newSW.state === 'activated' && navigator.serviceWorker.controller) {
                console.log('Versión nueva activada — recargando');
                window.location.reload();
              }
            });
          }
        });
      }).catch(err => console.log('SW falló:', err));
    });
  }
</script>
</body>
</html>
