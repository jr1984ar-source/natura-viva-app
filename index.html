<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a3818">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Natura Viva">
<title>Natura Viva Gardens</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <div class="logo-area">
      <svg width="28" height="28" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <path d="M16 3C9.5 3 4.5 8.5 4.5 16c0 3.4 1.2 6.5 3.2 8.8l1.2-1.2C7.2 21.5 6.2 18.9 6.2 16c0-5.8 4.4-10.5 9.8-10.5 2 0 3.8.7 5.3 1.8C19.8 9 19 11 19 13c0 3.6 2.9 6.5 6.5 6.5.7 0 1.3-.1 1.9-.3C27 21.2 26.2 23.5 26.2 23.5s-3.5-.5-6.5-2.5c-1.5-1-2.5-2.7-2.5-4.5 0-1 .3-2 .9-2.8" stroke="rgba(255,255,255,.92)" stroke-width="2" stroke-linecap="round"/>
        <path d="M13.5 20c1 2 2.8 3.8 5 5" stroke="rgba(255,255,255,.4)" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <div>
        <div class="logo-text">NATURA VIVA</div>
        <div class="logo-sub">GARDENS</div>
      </div>
    </div>
    <span class="bell">🔔</span>
  </div>
  <div class="nav-tabs" id="nav-tabs">
    <div class="nav-tab active" data-tab="mes">📅 Mes</div>
    <div class="nav-tab" data-tab="semana">🗓️ Semana</div>
    <div class="nav-tab" data-tab="equipo">👥 Equipo</div>
    <div class="nav-tab" data-tab="tareas">✓ Tareas</div>
  </div>
  <div class="content">
    <div id="view-mes"></div>
    <div id="view-semana" style="display:none"></div>
    <div id="view-equipo" style="display:none"></div>
    <div id="view-tareas" style="display:none"></div>
    <div id="view-casa" style="display:none"></div>
    <div id="view-empleado" style="display:none"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then(
        () => console.log('SW registrado'),
        err => console.log('SW falló:', err)
      );
    });
  }
</script>
</body>
</html>
